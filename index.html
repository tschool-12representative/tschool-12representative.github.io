<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首頁｜三年級學生代表</title>
  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="style/pages.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>
<body>
  <!-- Header -->

  <main class="container">
    <header class="site-header">
      <div class="header-inner">
        <a href="/">
        <div class="brand">
          <img src="logo.png" class="logo" alt="三年級學生代表" />
        </div>
        </a>
        <nav class="site-nav">
          <a href="javascript:void(0)" class="active">首頁</a>
          <a href="about">關於我們</a>
          <a href="javascript:alert('尚在開發中，敬請期待！')">關於視覺識別</a>
          <a href="https://tschool.tp.edu.tw" target="_blank">關於臺北市數位實驗高中</a>
        </nav>
      </div>
    </header>
    <!-- Latest News -->
    <section class="section">
      <h2 class="section-title"><img src="symbol.webp" alt="最新消息" />最新消息</h2>

      <!-- 讀取中提示 -->
      <div id="news-loading" class="news-loading">載入最新消息中…</div>

      <!-- 自動由 Google Sheet 產生的消息會插入這裡 -->
      <div id="news-list"></div>
    </section>

    <!-- Our Work -->
    <section class="section">
      <h2 class="section-title"><img src="symbol.webp" alt="我們的工作" />我們的工作！</h2>
      <div class="work-buttons">
        <a href="meetings" class="work-btn">校務會議資訊</a>
        <a href="dashboard" class="work-btn">提案進度儀表板</a>
        <a href="javascript:alert('目前尚在開發中')" class="work-btn">我也來提案！</a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-brand">
        <img src="logo.png" class="logo" alt="三年級學生代表" />
    </div>
  </footer>

  <!-- News Modal -->
  <div class="modal-overlay" id="newsModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="關閉">&times;</button>
      <h3 class="modal-title" id="modalTitle"></h3>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-image" id="modalImage"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="scripts/index.js"></script>
</body>
</html>
