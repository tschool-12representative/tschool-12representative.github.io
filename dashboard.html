<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>提案進度儀表板｜三年級學生代表</title>
  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="style/pages.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="/">
        <div class="brand">
          <img src="logo.png" class="logo" alt="三年級學生代表" />
        </div>
      </a>
      <nav class="site-nav">
        <a href="/">首頁</a>
        <a href="about">關於我們</a>
        <a href="https://tschool.tp.edu.tw" target="_blank">關於臺北市數位實驗高中</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-hero">
      <h1>提案進度儀表板</h1>
      <p>追蹤每一項提案從草擬到完結的進度。每張卡片標示類別與類型，並以進度條呈現目前所處階段。可用下方按鈕依類別篩選。</p>
    </div>

    <!-- 進度統計摘要 -->
    <div class="dash-summary" id="dashSummary"></div>

    <!-- 類別篩選 -->
    <div class="filter-row" id="filterRow"></div>

    <!-- 提案卡片 -->
    <div id="dashArea">
      <div class="state-loading" id="dashLoading">載入提案進度中…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-brand">
      <img src="logo.png" class="logo" alt="三年級學生代表" />
    </div>
  </footer>

  <script src="scripts/common.js"></script>
  <script src="scripts/dashboard.js"></script>
</body>
</html>
